name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Markdown files
        run: |
          echo "Validating repository structure..."
          test -f AGENTS.md && echo "✓ AGENTS.md exists" || (echo "✗ AGENTS.md missing" && exit 1)
          test -f README.md && echo "✓ README.md exists" || (echo "✗ README.md missing" && exit 1)
          test -f ai_changelog.md && echo "✓ ai_changelog.md exists" || (echo "✗ ai_changelog.md missing" && exit 1)
          test -f AI_QUALITY_PLAN.md && echo "✓ AI_QUALITY_PLAN.md exists" || (echo "✗ AI_QUALITY_PLAN.md missing" && exit 1)
          test -f .github/pull_request_template.md && echo "✓ pull_request_template.md exists" || (echo "✗ pull_request_template.md missing" && exit 1)
          echo "All required files validated successfully!"